name: Electron acceptance tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron system libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 libatk-bridge2.0-0 libdrm2
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install the Playwright video encoder
        run: npx playwright install ffmpeg
      - name: Run the real Electron suite
        run: xvfb-run -a npm run test:e2e -- --reporter=list,html
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
